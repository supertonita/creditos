<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Créditos - Mini Súper Toñita</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
       body { background-color: #e7e8e9; color: #000000; font-family: sans-serif; }
.bg-gray-900 { background-color: #c7c6c6 !important; border: 1px solid #e5e7eb !important; }

<body class="text-white-100 font-sans min-h-screen pb-10">

    <div id="view-login" class="view-section active min-h-screen flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 p-8 rounded-3xl shadow-2xl w-full max-w-sm space-y-6 text-center">
            <div>
                <div class="mx-auto w-16 h-16 bg-indigo-950/50 border border-indigo-500/30 rounded-2xl flex items-center justify-center text-2xl shadow-inner shadow-indigo-500/10">
                    
                </div>
                <h2 class="text-xl font-black tracking-wider text-white mt-4 uppercase">Súper Toñita Créditos</h2>
                <p class="text-[11px] text-gray-500 mt-1 uppercase tracking-widest">Ingresa tu código PIN de Acceso</p>
            </div>
            <div class="space-y-4">
                <input type="password" pattern="\d*" inputmode="numeric" id="login-pin" placeholder="••••••"

    <div id="view-app" class="view-section">
        <header class="bg-white-900/80 backdrop-blur-md border-b border-gray-800/60 p-4 sticky top-0 z-50">
            <div class="flex justify-between items-center max-w-md mx-auto">
                <h1 class="text-xs font-black tracking-widest uppercase text-indigo-400" id="app-user-title">Cargando...</h1>
                <button onclick="cerrarSesion()" class="text-[10px] uppercase tracking-widest bg-gray-800 border border-gray-700 px-3 py-2 rounded-xl font-bold text-gray-300 hover:bg-red-950/30 hover:text-red-400 hover:border-red-900/50 transition-colors">
                     Salir
                </button>
            </div>
            
            <div id="admin-tabs" class="hidden max-w-md mx-auto flex mt-4 bg-gray-950 border border-gray-800/80 rounded-xl p-1 text-[11px] font-bold tracking-wider uppercase">
                <button onclick="switchTab('clientes')" id="tab-btn-clientes" class="w-1/3 py-2.5 text-center rounded-lg bg-indigo-600 text-white transition-all">Clientes</button>
                <button onclick="switchTab('proveedores')" id="tab-btn-proveedores" class="w-1/3 py-2.5 text-center rounded-lg text-gray-400 transition-all"> Provs</button>
                <button onclick="switchTab('config')" id="tab-btn-config" class="w-1/3 py-2.5 text-center rounded-lg text-gray-400 transition-all">Conf.</button>
            </div>

        <main class="max-w-md mx-auto p-4 space-y-6">
            
            <section id="sec-clientes" class="tab-view hidden space-y-4">
                <div class="bg-gray-900 border border-gray-800/80 p-4 rounded-2xl shadow-sm">
                    <h3 class="font-bold text-gray-400 mb-2.5 text-[10px] uppercase tracking-widest">Nuevo Cliente a Crédito</h3>
                    <div class="space-y-2">

                        <input type="tel" id="new-cli-telefono" placeholder="WhatsApp (WhatsApp)"

                        <button onclick="crearCliente()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-bold text-xs uppercase tracking-widest">Añadir Cliente</button>
                    </div>

                <div id="lista-clientes" class="space-y-3"></div>
            </section>

            <section id="sec-proveedores" class="tab-view hidden space-y-4">
                <div id="lista-proveedores" class="space-y-3"></div>
            </section>

            <section id="sec-config" class="tab-view hidden space-y-4">
                <div id="form-nuevo-proveedor" class="bg-gray-900 border border-gray-800/80 p-5 rounded-2xl shadow-sm space-y-3">
                    <div>
                        <h3 class="font-bold text-white text-xs uppercase tracking-wider border-b border-gray-800 pb-2">🚚 Registrar Nueva Distribuidora</h3>
                        <p class="text-[10px] text-gray-500 mt-1">Crea las credenciales de acceso privado para tus proveedores.</p>
                    </div>
                    
                    <div class="space-y-2 pt-1">
                        <input type="text" id="new-prov-nombre" placeholder="Nombre de Distribuidora" 
                               class="w-full bg-gray-950 border border-gray-800 p-3 rounded-xl text-sm text-gray-200 focus:outline-none focus:border-indigo-500">
                        <input type="email" id="new-prov-email" placeholder=" nombre@cliente.com" 
                               class="w-full bg-gray-950 border border-gray-800 p-3 rounded-xl text-sm text-gray-200 focus:outline-none focus:border-indigo-500">
                        <input type="tel" id="new-prov-telefono" placeholder="Número de WhatsApp" 
                               class="w-full bg-gray-950 border border-gray-800 p-3 rounded-xl text-sm text-gray-200 focus:outline-none focus:border-indigo-500">
                        <input type="password" pattern="\d*" inputmode="numeric" id="new-prov-pin" placeholder="Asignar PIN de acceso" 
                               class="w-full bg-gray-950 border border-gray-800 p-3 rounded-xl text-sm text-gray-200 focus:outline-none focus:border-indigo-500">
                        
                        <button onclick="crearProveedor()" id="btn-crear-prov" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-bold text-xs uppercase tracking-widest mt-2 transition-colors shadow-md">

                        </button>

                <div class="bg-gray-900 border border-gray-800/80 p-4 rounded-2xl text-center">

    <div id="modal-transaccion" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl w-full max-w-sm p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                <h3 id="modal-titulo" class="font-bold text-white text-xs uppercase tracking-widest">Registrar Movimiento</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-white font-bold text-xl transition-colors">&times;</button>
            </div>
            <input type="hidden" id="modal-tipo-entidad">
            <input type="hidden" id="modal-entidad-id">
            <input type="hidden" id="modal-tipo-movimiento">
            
            <div>
                <label class="block text-[10px] font-bold text-black-500 uppercase tracking-widest mb-1.5">Monto en Efectivo ($)</label>
                <input type="number" id="modal-monto" step="0.01" placeholder="0.00" 
                       class="w-full bg-gray-950 border border-gray-800 p-3.5 rounded-xl text-2xl font-bold text-emerald-400 text-center focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-[10px] font-bold text-black-500 uppercase tracking-widest mb-1.5">Detalle de Factura</label>
                <input type="text" id="modal-detalle" placeholder="escribe una descripcion" 
                       class="w-full bg-gray-950 border border-gray-800 p-2.5 rounded-xl text-sm text-black-200 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-[10px] font-bold text-black-500 uppercase tracking-widest mb-1.5">Adjuntar Evidencia (Foto / PDF)</label>
                <input type="file" id="modal-file" accept="image/*,application/pdf" class="w-full text-xs text-black-500 bg-gray-950 p-2 rounded-xl border border-gray-800">
            </div>
            <button onclick="ejecutarMovimiento()" id="btn-guardar-mov" 
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3.5 rounded-xl font-bold text-xs uppercase tracking-widest shadow-md transition-colors">
                 Guardar en Base de Datos
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDt-C5k_4Kf_9umGl06LC9WN2EV97O83jc",
            authDomain: "creditoscorinto.firebaseapp.com",
            projectId: "creditoscorinto",
            storageBucket: "creditoscorinto.firebasestorage.app",
            messagingSenderId: "435931226890",
            appId: "1:435931226890:web:bfa60cf3828b348a4a10f3",
            measurementId: "G-G0EDE75NPX"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        const CORREO_ADMIN = "minisupertonita@gmail.com"; 
        const PIN_ADMIN = "199818"; 
        const CONTRASENA_OCULTA_ADMIN = "FrankMaster2026*"; 
        const PIN_BAJA = "1234";

        let esAdmin = false;
        let proveedorLogueadoEmail = null;
        let cacheMovimientos = {};

        async function iniciarSesionPorPin() {
            const pinIngresado = document.getElementById('login-pin').value.trim();
            const btn = document.getElementById('btn-login');
            if(!pinIngresado) return alert("Escribe tu código PIN, parce.");

            btn.innerText = "⏳ Verificando PIN...";
            btn.disabled = true;

            if (pinIngresado === PIN_ADMIN) {
                try {
                    await auth.signInWithEmailAndPassword(CORREO_ADMIN, CONTRASENA_OCULTA_ADMIN);
                    document.getElementById('login-pin').value = "";
                } catch (error) {
                    alert("Error Administrador: " + error.message);
                } finally {
                    btn.innerText = "🚀 Entrar al Sistema";
                    btn.disabled = false;
                }
                return;
            }

            try {
                const snapshot = await db.collection("proveedores")
                                       .where("pin_acceso", "==", pinIngresado)
                                       .where("activo", "==", true)
                                       .limit(1)
                                       .get();

                if (snapshot.empty) {
                    alert("❌ Código PIN no registrado.");
                    btn.innerText = "🚀 Entrar al Sistema";
                    btn.disabled = false;
                    return;
                }

                const datosProv = snapshot.docs[0].data();
                proveedorLogueadoEmail = datosProv.email_proveedor.toLowerCase();
                esAdmin = false;

                document.getElementById('login-pin').value = "";
                renderizarEntornoApp(false, datosProv.nombre, proveedorLogueadoEmail);

            } catch (error) {
                alert("Error de conexión: " + error.message);
            } finally {
                btn.innerText = "🚀 Entrar al Sistema";
                btn.disabled = false;
            }
        }

        function cerrarSesion() {
            auth.signOut().then(() => {
                proveedorLogueadoEmail = null;
                esAdmin = false;
                document.getElementById('view-app').classList.remove('active');
                document.getElementById('view-app').style.display = 'none';
                document.getElementById('view-login').classList.add('active');
                document.getElementById('view-login').style.display = 'flex';
            });
        }

        auth.onAuthStateChanged((user) => {
            if (user && user.email.toLowerCase() === CORREO_ADMIN.toLowerCase()) {
                esAdmin = true;
                proveedorLogueadoEmail = null;
                renderizarEntornoApp(true, "Súper Toñita (Admin)", CORREO_ADMIN);
            }
        });

        function renderizarEntornoApp(isAdminRole, nombreMostrar, emailRole) {
            document.getElementById('view-login').classList.remove('active');
            document.getElementById('view-login').style.display = 'none';
            document.getElementById('view-app').classList.add('active');
            document.getElementById('view-app').style.display = 'block';

            document.getElementById('app-user-title').innerText = isAdminRole ? `⚡ ${nombreMostrar}` : `🚚 PROV: ${nombreMostrar}`;

            if (isAdminRole) {
                document.getElementById('admin-tabs').classList.remove('hidden');
                switchTab('clientes');
                escucharClientes();
                escucharProveedores();
            } else {
                document.getElementById('admin-tabs').classList.add('hidden');
                switchTab('proveedores');
                escucharProveedoresRestringido(emailRole);
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-view').forEach(el => el.classList.add('hidden'));
            document.getElementById(`sec-${tabId}`).classList.remove('hidden');
            
            if(esAdmin) {
                document.querySelectorAll('#admin-tabs button').forEach(b => { 
                    b.classList.remove('bg-indigo-600', 'text-white'); 
                    b.classList.add('text-gray-400'); 
                });
                const activeBtn = document.getElementById(`tab-btn-${tabId}`);
                if(activeBtn) { 
                    activeBtn.classList.remove('text-gray-400'); 
                    activeBtn.classList.add('bg-indigo-600', 'text-white'); 
                }
            }
        }

        async function crearCliente() {
            const nombre = document.getElementById('new-cli-nombre').value.trim();
            const telefono = document.getElementById('new-cli-telefono').value.trim();
            if(!nombre) return alert("Escribe el nombre.");
            await db.collection("clientes").add({ nombre, telefono: telefono || "", saldo: 0, activo: true, fecha: new Date().toISOString() });
            document.getElementById('new-cli-nombre').value = "";
            document.getElementById('new-cli-telefono').value = "";
        }

        async function crearProveedor() {
            const nombre = document.getElementById('new-prov-nombre').value.trim();
            const email = document.getElementById('new-prov-email').value.trim().toLowerCase();
            const telefono = document.getElementById('new-prov-telefono').value.trim();
            const pin = document.getElementById('new-prov-pin').value.trim();
            const btn = document.getElementById('btn-crear-prov');

            if(!nombre || !email || !pin) return alert("Por favor complete todos los datos requeridos.");
            
            btn.innerText = "⏳ Guardando...";
            btn.disabled = true;

            try {
                await db.collection("proveedores").add({ 
                    nombre: nombre, 
                    email_proveedor: email,
                    telefono_proveedor: telefono || "", 
                    pin_acceso: pin, 
                    saldo: 0, 
                    activo: true, 
                    fecha: new Date().toISOString() 
                });
                
                alert(`🚀 Distribuidora "${nombre}" habilitada con éxito.`);
                document.getElementById('new-prov-nombre').value = ""; 
                document.getElementById('new-prov-email').value = "";
                document.getElementById('new-prov-telefono').value = "";
                document.getElementById('new-prov-pin').value = "";
                switchTab('proveedores'); // Te redirige automáticamente a ver los proveedores al crearlo
            } catch (error) {
                alert("Error al guardar proveedor: " + error.message);
            } finally {
                btn.innerText = "🚀 Crear y Habilitar Proveedor";
                btn.disabled = false;
            }
        }

        function escucharClientes() {
            db.collection("clientes").where("activo", "==", true).onSnapshot((snapshot) => {
                const contenedor = document.getElementById('lista-clientes'); contenedor.innerHTML = "";
                snapshot.forEach(docSnap => {
                    const id = docSnap.id; const item = docSnap.data();
                    const tarjeta = crearTarjetaUI('clientes', id, item.nombre, item.saldo, esAdmin, item.telefono || "");
                    contenedor.appendChild(tarjeta);
                    escucharHistorial(id, tarjeta.querySelector('.historial-box'));
                });
            });
        }

        function escucharProveedores() {
            db.collection("proveedores").where("activo", "==", true).onSnapshot((snapshot) => {
                const contenedor = document.getElementById('lista-proveedores'); contenedor.innerHTML = "";
                snapshot.forEach(docSnap => {
                    const id = docSnap.id; const item = docSnap.data();
                    const tarjeta = crearTarjetaUI('proveedores', id, item.nombre, item.saldo, true, item.telefono_proveedor || "");
                    contenedor.appendChild(tarjeta);
                    escucharHistorial(id, tarjeta.querySelector('.historial-box'));
                });
            });
        }

        function escucharProveedoresRestringido(emailProveedor) {
            db.collection("proveedores").where("email_proveedor", "==", emailProveedor).where("activo", "==", true).onSnapshot((snapshot) => {
                const contenedor = document.getElementById('lista-proveedores'); contenedor.innerHTML = "";
                snapshot.forEach(docSnap => {
                    const id = docSnap.id; const item = docSnap.data();
                    const tarjeta = crearTarjetaUI('proveedores', id, item.nombre, item.saldo, false, item.telefono_proveedor || "");
                    contenedor.appendChild(tarjeta);
                    escucharHistorial(id, tarjeta.querySelector('.historial-box'));
                });
            });
        }

        // --- CORRECCIÓN FIJA DEL HISTORIAL DE MOVIMIENTOS ---
        function escucharHistorial(entidadId, contenedorHistorial) {
            // Quitamos el query .orderBy() directo de Firebase para evitar la traba del índice compuesto requerido
            db.collection("movimientos_credito").where("entidad_id", "==", entidadId).onSnapshot((snapshot) => {
                contenedorHistorial.innerHTML = "";
                cacheMovimientos[entidadId] = [];
                
                if(snapshot.empty) { 
                    contenedorHistorial.innerHTML = `<p class="text-[10px] text-gray-600 italic">Sin movimientos registrados.</p>`; 
                    return; 
                }

                let arrMovimientos = [];
                snapshot.forEach(docSnap => {
                    arrMovimientos.push(docSnap.data());
                });

                // Ordenamos el arreglo nativamente en memoria por fecha descendiente (más reciente primero)
                arrMovimientos.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
                cacheMovimientos[entidadId] = arrMovimientos;

                arrMovimientos.forEach(h => {
                    const dateStr = h.fecha ? new Date(h.fecha).toLocaleDateString() : '';
                    const linkAdjunto = h.url_adjunto ? `<a href="${h.url_adjunto}" target="_blank" class="underline ml-1 font-bold text-indigo-400">📎 Archivo</a>` : '';
                    
                    let colorTexto = h.tipo_movimiento === 'factura' ? 'text-red-400' : 'text-emerald-400';
                    let signo = h.tipo_movimiento === 'factura' ? '+' : '-';

                    const div = document.createElement('div');
                    div.className = `flex justify-between items-center text-[11px] py-1.5 border-b border-gray-950 ${colorTexto}`;
                    div.innerHTML = `<span>${dateStr} - ${h.detalle} ${linkAdjunto}</span><span class="font-bold">${signo}$${h.monto.toFixed(2)}</span>`;
                    contenedorHistorial.appendChild(div);
                });
            });
        }

        function abrirModalTransaccion(tipoEntidad, id, tipoMovimiento, nombre) {
            document.getElementById('modal-tipo-entidad').value = tipoEntidad; document.getElementById('modal-entidad-id').value = id; document.getElementById('modal-tipo-movimiento').value = tipoMovimiento;
            
            let accionTexto = "";
            if(tipoEntidad === 'clientes') {
                accionTexto = tipoMovimiento === 'factura' ? '➕ Nueva Factura (Suma Deuda)' : '💵 Registrar Abono (Resta Deuda)';
            } else {
                accionTexto = tipoMovimiento === 'factura' ? '➕ Recibir Factura (Suma Tu Deuda)' : '💵 Registrar Pago (Resta Tu Deuda)';
            }

            document.getElementById('modal-titulo').innerText = `${accionTexto} ➔ ${nombre}`;
            document.getElementById('modal-monto').value = ""; document.getElementById('modal-detalle').value = ""; document.getElementById('modal-file').value = "";
            document.getElementById('modal-transaccion').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('modal-transaccion').classList.add('hidden'); }

        async function ejecutarMovimiento() {
            const tipoEntidad = document.getElementById('modal-tipo-entidad').value; 
            const entidadId = document.getElementById('modal-entidad-id').value;
            const tipoMovimiento = document.getElementById('modal-tipo-movimiento').value; 
            const monto = parseFloat(document.getElementById('modal-monto').value);
            const detalle = document.getElementById('modal-detalle').value.trim() || (tipoMovimiento === 'factura' ? 'Factura' : 'Abono');
            const fileInput = document.getElementById('modal-file');

            if(isNaN(monto) || monto <= 0) return alert("Monto no válido.");
            const btn = document.getElementById('btn-guardar-mov'); btn.innerText = "⏳ Guardando..."; btn.disabled = true;

            try {
                let url_adjunto = null;
                if(fileInput.files.length > 0) {
                    const archivo = fileInput.files[0];
                    const storageRef = storage.ref(`comprobantes/${Date.now()}_${archivo.name}`);
                    const uploadSnap = await storageRef.put(archivo);
                    url_adjunto = await uploadSnap.ref.getDownloadURL();
                }

                const entidadDocRef = db.collection(tipoEntidad).doc(entidadId);
                await db.runTransaction(async (transaction) => {
                    const sfDoc = await transaction.get(entidadDocRef);
                    let saldoActual = sfDoc.data().saldo || 0;
                    let nuevoSaldo = tipoMovimiento === 'factura' ? saldoActual + monto : saldoActual - monto;

                    transaction.update(entidadDocRef, { saldo: nuevoSaldo });
                    
                    const nuevoMovRef = db.collection("movimientos_credito").doc();
                    transaction.set(nuevoMovRef, {
                        tipo_entidad: tipoEntidad === 'clientes' ? 'cliente' : 'proveedor',
                        entidad_id: entidadId, 
                        tipo_movimiento: tipoMovimiento, 
                        monto: monto, 
                        detalle: detalle, 
                        url_adjunto: url_adjunto, 
                        fecha: new Date().toISOString()
                    });
                });
                closeModal();
            } catch (e) { alert("Error: " + e); } finally { btn.innerText = " Guardar en Base de Datos"; btn.disabled = false; }
        }

        async function ejecutarBaja(tipoEntidad, id, nombre) {
            const pin = prompt(`🔒 PIN de seguridad para dar de baja a:\n"${nombre}"`);
            if (pin === PIN_BAJA) { await db.collection(tipoEntidad).doc(id).update({ activo: false }); alert("Dado de baja con éxito."); } 
            else if (pin !== null) { alert("❌ PIN Incorrecto."); }
        }

        function enviarWhatsApp(nombre, saldo, tipoEntidad, numeroTelefono) {
            let mensaje = "";
            if(tipoEntidad === 'clientes') {
                mensaje = `Hola ${nombre}, te saludamos de Mini Súper Toñita. Te informamos que tu saldo actual de cuenta crédito es de *$${saldo.toFixed(2)}*. ¡Gracias por tu preferencia!`;
            } else {
                mensaje = `Hola, te saludamos de Mini Súper Toñita. Queremos informarle que registramos una actualización en nuestro estado de cuenta. Nuestro saldo actual con ustedes es de *$${saldo.toFixed(2)}*. Quedamos al día.`;
            }
            
            let url = "";
            if(numeroTelefono) {
                const numLimpio = numeroTelefono.replace(/[^0-9]/g, "");
                url = `https://api.whatsapp.com/send?phone=${numLimpio}&text=${encodeURIComponent(mensaje)}`;
            } else {
                url = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensaje)}`;
            }
            window.open(url, '_blank');
        }

        function exportarExcel(nombre, saldo, entidadId, tipoEntidad) {
            const lista = cacheMovimientos[entidadId] || [];
            if(lista.length === 0) return alert("No hay movimientos registrados para exportar.");

            let csvContent = "\uFEFF"; 
            csvContent += `Reporte de Estado de Cuenta: ${nombre}\n`;
            csvContent += `Tipo: ${tipoEntidad === 'clientes' ? 'Cliente a Credito' : 'Distribuidora / Proveedor'}\n`;
            csvContent += `Saldo Actual Total: $${saldo.toFixed(2)}\n\n`;
            csvContent += "Fecha,Detalle,Tipo Movimiento,Monto ($)\n";

            lista.forEach(m => {
                const fechaFmt = new Date(m.fecha).toLocaleDateString();
                const tipoMov = m.tipo_movimiento === 'factura' ? 'Factura (+)' : 'Abono / Pago (-)';
                csvContent += `"${fechaFmt}","${m.detalle}","${tipoMov}","${m.monto.toFixed(2)}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Estado_Cuenta_${nombre.replace(/ /g, "_")}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function crearTarjetaUI(tipoEntidad, id, nombre, saldo, modoCompleto, telefono) {
            const div = document.createElement('div'); 
            div.className = "bg-gray-900 border border-gray-800 p-5 rounded-2xl shadow-md space-y-4 relative";
            
            const botonBaja = modoCompleto ? `<button onclick="ejecutarBaja('${tipoEntidad}', '${id}', '${nombre}')" class="absolute top-4 right-4 text-[9px] text-gray-600 hover:text-red-400 font-bold uppercase tracking-widest transition-colors">🚫 Baja</button>` : '';
            
            let txtFactura = tipoEntidad === 'clientes' ? '📄 + Factura' : '📄 + Recibir Factura';
            let txtAbono = tipoEntidad === 'clientes' ? '💵 Registrar Abono' : '💵 Registrar Pago';

            div.innerHTML = `
                ${botonBaja}
                <div class="flex justify-between items-start pr-10">
                    <div>
                        <h4 class="font-black text-gray-100 text-base tracking-wide mb-0.5">${nombre}</h4>
                        <span class="text-[9px] bg-gray-950 border border-gray-850 text-gray-500 px-2 py-0.5 rounded-md font-mono">${id.substring(0,6)}...</span>
                    </div>
                    <div class="text-right">
                        <span class="text-[9px] text-gray-500 block uppercase font-bold tracking-widest">${tipoEntidad === 'clientes' ? 'Saldo Deuda' : 'Le Debes'}</span>
                        <span class="text-xl font-black ${saldo > 0 ? 'text-red-400' : 'text-gray-400'}">$${saldo.toFixed(2)}</span>
                    </div>
                </div>
                
                <div class="flex gap-3">
                    <button onclick="abrirModalTransaccion('${tipoEntidad}', '${id}', 'factura', '${nombre}')" class="flex-1 bg-red-950/40 hover:bg-red-900/40 text-red-400 py-3 rounded-xl text-xs font-bold border border-red-900/50 transition-colors">${txtFactura}</button>
                    <button onclick="abrirModalTransaccion('${tipoEntidad}', '${id}', 'abono', '${nombre}')" class="flex-1 bg-emerald-950/40 hover:bg-emerald-900/40 text-emerald-400 py-3 rounded-xl text-xs font-bold border border-emerald-900/50 transition-colors">${txtAbono}</button>
                </div>

                <div class="flex gap-2 border-t border-gray-850 pt-3">
                    <button onclick="enviarWhatsApp('${nombre}', ${saldo}, '${tipoEntidad}', '${telefono}')" class="flex-1 bg-gray-950 hover:bg-gray-800 text-emerald-500 font-bold text-[10px] uppercase py-2 px-3 border border-emerald-950 rounded-xl transition-colors flex items-center justify-center gap-1">
                        💬 Notificar WhatsApp
                    </button>
                    <button onclick="exportarExcel('${nombre}', ${saldo}, '${id}', '${tipoEntidad}')" class="flex-1 bg-gray-950 hover:bg-gray-800 text-indigo-400 font-bold text-[10px] uppercase py-2 px-3 border border-indigo-950 rounded-xl transition-colors flex items-center justify-center gap-1">
                        📊 Guardar Excel
                    </button>
                </div>
                
                <div class="bg-gray-950 border border-gray-850 p-3 rounded-xl">
                    <p class="text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-2">Historial de Operaciones</p>
                    <div class="historial-box max-h-28 overflow-y-auto space-y-1.5 pr-1">
                        <p class="text-[10px] text-gray-600 italic">Cargando datos...</p>
                    </div>
                </div>
            `;
            return div;
        }
    </script>
</body>
