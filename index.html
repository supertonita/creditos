<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Créditos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-storage-compat.js"></script>

    <style>
        .view-section { display: none; }
        .view-section.active { display: block; }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen pb-10">

    <div id="view-login" class="view-section active min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-2xl shadow-md w-full max-w-sm space-y-4">
            <div class="text-center">
                <span class="text-4xl">🔐</span>
                <h2 class="text-xl font-black text-gray-800 mt-2">CONTROL DE CRÉDITOS</h2>
                <p class="text-xs text-gray-400">pin de acceso</p>
            </div>
            <div class="space-y-3">
                <input type="password" pattern="\d*" inputmode="numeric" id="login-pin" placeholder="••••••" class="w-full border p-4 rounded-xl text-center text-2xl font-bold tracking-widest focus:outline-indigo-500">
                <button onclick="iniciarSesionPorPin()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold text-sm shadow-md hover:bg-indigo-700">
                    🚀 Entrar
                </button>
            </div>
        </div>
    </div>

    <div id="view-app" class="view-section">
        <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50">
            <div class="flex justify-between items-center max-w-md mx-auto">
                <h1 class="text-sm font-black tracking-wider uppercase" id="app-user-title">Cargando...</h1>
                <button onclick="cerrarSesion()" class="text-xs bg-indigo-700 px-3 py-1.5 rounded-lg font-bold hover:bg-indigo-800">
                    🚪 Salir
                </button>
            </div>
            
            <div id="admin-tabs" class="hidden max-w-md mx-auto flex mt-3 bg-indigo-700 rounded-lg p-1 text-xs font-bold">
                <button onclick="switchTab('clientes')" id="tab-btn-clientes" class="w-1/3 py-2 text-center rounded-md bg-white text-indigo-700">👥 Clientes</button>
                <button onclick="switchTab('proveedores')" id="tab-btn-proveedores" class="w-1/3 py-2 text-center rounded-md text-white">🚚 Proveedores</button>
                <button onclick="switchTab('config')" id="tab-btn-config" class="w-1/3 py-2 text-center rounded-md text-white">⚙️ Config</button>
            </div>
        </header>

        <main class="max-w-md mx-auto p-4 space-y-6">
            <section id="sec-clientes" class="tab-view hidden space-y-4">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                    <h3 class="font-bold text-gray-700 mb-2 text-xs uppercase">Nuevo Cliente a Crédito</h3>
                    <div class="flex gap-2">
                        <input type="text" id="new-cli-nombre" placeholder="Nombre o Apodo del cliente" class="flex-1 border p-2 rounded-lg text-sm focus:outline-indigo-500">
                        <button onclick="crearCliente()" class="bg-indigo-600 text-white px-4 rounded-lg font-bold">+</button>
                    </div>
                </div>
                <div id="lista-clientes" class="space-y-3"></div>
            </section>

            <section id="sec-proveedores" class="tab-view hidden space-y-4">
                <div id="form-nuevo-proveedor" class="hidden bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                    <h3 class="font-bold text-gray-700 mb-2 text-xs uppercase">Registrar Distribuidora / Proveedor</h3>
                    <div class="space-y-2">
                        <input type="text" id="new-prov-nombre" placeholder="Nombre (Ej: Tienda Rosa)" class="w-full border p-2 rounded-lg text-sm focus:outline-indigo-500">
                        <input type="email" id="new-prov-email" placeholder="Correo del Proveedor (Ej: elbinchavez@gmail.com)" class="w-full border p-2 rounded-lg text-sm focus:outline-indigo-500">
                        <button onclick="crearProveedor()" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-bold text-xs uppercase tracking-wider">Crear y Habilitar</button>
                    </div>
                </div>
                <div id="lista-proveedores" class="space-y-3"></div>
            </section>

            <section id="sec-config" class="tab-view hidden bg-white p-4 rounded-xl shadow-sm border border-gray-200 space-y-3">
                <h3 class="font-bold text-gray-700 text-sm uppercase border-b pb-2">Panel de Administración</h3>
                <p class="text-xs text-gray-500">Crea los accesos para tus proveedores en Firebase Auth.</p>
                <div class="space-y-2 bg-gray-50 p-3 rounded-lg border">
                    <p class="text-xs font-bold text-gray-600">🔑 Crear Credencial de Acceso para Proveedor:</p>
                    <input type="email" id="auth-email" placeholder="Correo del Proveedor" class="w-full border p-2 rounded-lg text-sm bg-white">
                    <input type="password" id="auth-pass" placeholder="Contraseña de acceso" class="w-full border p-2 rounded-lg text-sm bg-white">
                    <button onclick="crearUsuarioAuth()" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-bold text-xs uppercase">Registrar en Firebase</button>
                </div>
            </section>
        </main>
    </div>

    <div id="modal-transaccion" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 id="modal-titulo" class="font-bold text-gray-800 text-sm">Registrar Movimiento</h3>
                <button onclick="closeModal()" class="text-gray-400 font-bold text-xl">&times;</button>
            </div>
            <input type="hidden" id="modal-tipo-entidad">
            <input type="hidden" id="modal-entidad-id">
            <input type="hidden" id="modal-tipo-movimiento">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Monto ($)</label>
                <input type="number" id="modal-monto" step="0.01" placeholder="0.00" class="w-full border p-3 rounded-xl text-lg font-bold focus:outline-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Detalle / Ref. Factura</label>
                <input type="text" id="modal-detalle" placeholder="Ej: Factura #245" class="w-full border p-2 rounded-lg text-sm focus:outline-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Adjuntar Comprobante (Foto o PDF)</label>
                <input type="file" id="modal-file" accept="image/*,application/pdf" class="w-full text-xs text-gray-500">
            </div>
            <button onclick="ejecutarMovimiento()" id="btn-guardar-mov" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold text-sm shadow-md">
                💾 Guardar Registro
            </button>
        </div>
    </div>

    <script>
        // Configuración oficial de tu app
        const firebaseConfig = {
            apiKey: "AIzaSyDt-C5k_4Kf_9umGl06LC9WN2EV97O83jc",
            authDomain: "creditoscorinto.firebaseapp.com",
            projectId: "creditoscorinto",
            storageBucket: "creditoscorinto.firebasestorage.app",
            messagingSenderId: "435931226890",
            appId: "1:435931226890:web:bfa60cf3828b348a4a10f3",
            measurementId: "G-G0EDE75NPX"
        };

        // Inicializar Firebase en modo Global Estable
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        // Parámetros de seguridad de Frank
        const CORREO_ADMIN = "minisupertonita@gmail.com"; 
        const PIN_ADMIN = "199818"; 
        const CONTRASENA_OCULTA_ADMIN = "FrankMaster2026*"; // Esta es la clave asignada en tu captura
        const PIN_BAJA = "1234";

        let esAdmin = false;

        // --- SISTEMA DE INICIO DE SESIÓN INTEGRADO POR PIN ---
        async function iniciarSesionPorPin() {
            const pinIngresado = document.getElementById('login-pin').value.trim();
            if(!pinIngresado) return alert("Escribe el código, parce.");

            if (pinIngresado !== PIN_ADMIN) {
                alert("❌ Código PIN de Administrador incorrecto.");
                return;
            }

            try {
                // Ejecución directa garantizada
                await auth.signInWithEmailAndPassword(CORREO_ADMIN, CONTRASENA_OCULTA_ADMIN);
                document.getElementById('login-pin').value = "";
            } catch (error) {
                alert("Error de Firebase:\n" + error.message + "\n\nVerifica que la contraseña del usuario en tu consola sea exactamente: " + CONTRASENA_OCULTA_ADMIN);
            }
        }

        function cerrarSesion() {
            auth.signOut();
        }

        // --- OBSERVADOR DE ESTADO DE ACCESO ---
        auth.onAuthStateChanged((user) => {
            if (user) {
                esAdmin = (user.email.toLowerCase() === CORREO_ADMIN.toLowerCase());
                document.getElementById('view-login').classList.remove('active');
                document.getElementById('view-app').classList.add('active');
                document.getElementById('app-user-title').innerText = esAdmin ? "⚡ Frank (Admin)" : `🚚 PROV: ${user.email}`;

                if (esAdmin) {
                    document.getElementById('admin-tabs').classList.remove('hidden');
                    document.getElementById('form-nuevo-proveedor').classList.remove('hidden');
                    switchTab('clientes');
                    escucharClientes();
                    escucharProveedores();
                } else {
                    document.getElementById('admin-tabs').classList.add('hidden');
                    document.getElementById('form-nuevo-proveedor').classList.add('hidden');
                    switchTab('proveedores');
                    escucharProveedoresRestringido(user.email.toLowerCase());
                }
            } else {
                esAdmin = false;
                document.getElementById('view-app').classList.remove('active');
                document.getElementById('view-login').classList.add('active');
            }
        });

        function switchTab(tabId) {
            document.querySelectorAll('.tab-view').forEach(el => el.classList.add('hidden'));
            document.getElementById(`sec-${tabId}`).classList.remove('hidden');
            if(esAdmin) {
                document.querySelectorAll('#admin-tabs button').forEach(b => { b.classList.remove('bg-white', 'text-indigo-700'); b.classList.add('text-white'); });
                const activeBtn = document.getElementById(`tab-btn-${tabId}`);
                if(activeBtn) { activeBtn.classList.remove('text-white'); activeBtn.classList.add('bg-white', 'text-indigo-700'); }
            }
        }

        async function crearUsuarioAuth() {
            const email = document.getElementById('auth-email').value.trim();
            const pass = document.getElementById('auth-pass').value;
            if(!email || pass.length < 6) return alert("Completa los datos de proveedor (Clave min 6 caracteres).");
            try {
                // Crea el usuario sin desloguear la sesión actual
                const secundaryApp = firebase.initializeApp(firebaseConfig, "Secondary");
                await secundaryApp.auth().createUserWithEmailAndPassword(email, pass);
                await secundaryApp.delete();
                alert(`¡Listo! Credencial creada para ${email}.`);
                document.getElementById('auth-email').value = "";
                document.getElementById('auth-pass').value = "";
            } catch (error) { alert("Error: " + error.message); }
        }

        async function crearCliente() {
            const nombre = document.getElementById('new-cli-nombre').value.trim();
            if(!nombre) return alert("Escribe el nombre.");
            await db.collection("clientes").add({ nombre, saldo: 0, activo: true, fecha: new Date().toISOString() });
            document.getElementById('new-cli-nombre').value = "";
        }

        function escucharClientes() {
            db.collection("clientes").where("activo", "==", true).onSnapshot((snapshot) => {
                const contenedor = document.getElementById('lista-clientes'); contenedor.innerHTML = "";
                snapshot.forEach(docSnap => {
                    const id = docSnap.id; const item = docSnap.data();
                    const tarjeta = crearTarjetaUI('clientes', id, item.nombre, item.saldo, esAdmin);
                    contenedor.appendChild(tarjeta);
                    escucharHistorial(id, tarjeta.querySelector('.historial-box'));
                });
            });
        }

        async function crearProveedor() {
            const nombre = document.getElementById('new-prov-nombre').value.trim();
            const email = document.getElementById('new-prov-email').value.trim().toLowerCase();
            if(!nombre || !email) return alert("Completa los datos.");
            await db.collection("proveedores").add({ nombre, email_proveedor: email, saldo: 0, activo: true, fecha: new Date().toISOString() });
            document.getElementById('new-prov-nombre').value = ""; document.getElementById('new-prov-email').value = "";
            alert("Proveedor vinculado.");
        }

        function escucharProveedores() {
            db.collection("proveedores").where("activo", "==", true).onSnapshot((snapshot) => {
                const contenedor = document.getElementById('lista-proveedores'); contenedor.innerHTML = "";
                snapshot.forEach(docSnap => {
                    const id = docSnap.id; const item = docSnap.data();
                    const tarjeta = crearTarjetaUI('proveedores', id, item.nombre, item.saldo, true);
                    contenedor.appendChild(tarjeta);
                    escucharHistorial(id, tarjeta.querySelector('.historial-box'));
                });
            });
        }

        function escucharProveedoresRestringido(emailProveedor) {
            db.collection("proveedores").where("email_proveedor", "==", emailProveedor).where("activo", "==", true).onSnapshot((snapshot) => {
                const contenedor = document.getElementById('lista-proveedores'); contenedor.innerHTML = "";
                snapshot.forEach(docSnap => {
                    const id = docSnap.id; const item = docSnap.data();
                    const tarjeta = crearTarjetaUI('proveedores', id, item.nombre, item.saldo, false);
                    contenedor.appendChild(tarjeta);
                    escucharHistorial(id, tarjeta.querySelector('.historial-box'));
                });
            });
        }

        function escucharHistorial(entidadId, contenedorHistorial) {
            db.collection("movimientos_credito").where("entidad_id", "==", entidadId).orderBy("fecha", "desc").onSnapshot((snapshot) => {
                contenedorHistorial.innerHTML = "";
                if(snapshot.empty) { contenedorHistorial.innerHTML = `<p class="text-[10px] text-gray-400 italic">Sin movimientos.</p>`; return; }
                snapshot.forEach(docSnap => {
                    const h = docSnap.data();
                    const dateStr = h.fecha ? new Date(h.fecha).toLocaleDateString() : '';
                    const linkAdjunto = h.url_adjunto ? `<a href="${h.url_adjunto}" target="_blank" class="underline ml-1 font-bold text-indigo-600">📎 Ver Adjunto</a>` : '';
                    const div = document.createElement('div');
                    div.className = `flex justify-between items-center text-xs py-1 border-b border-gray-100 ${h.tipo_movimiento === 'factura' ? 'text-red-600' : 'text-emerald-600'}`;
                    div.innerHTML = `<span>${dateStr} - ${h.detalle} ${linkAdjunto}</span><span class="font-bold">${h.tipo_movimiento === 'factura' ? '+' : '-'}$${h.monto.toFixed(2)}</span>`;
                    contenedorHistorial.appendChild(div);
                });
            }, error => {
                console.log("Esperando index...");
            });
        }

        function abrirModalTransaccion(tipoEntidad, id, tipoMovimiento, nombre) {
            document.getElementById('modal-tipo-entidad').value = tipoEntidad; document.getElementById('modal-entidad-id').value = id; document.getElementById('modal-tipo-movimiento').value = tipoMovimiento;
            document.getElementById('modal-titulo').innerText = `${tipoMovimiento === 'factura' ? '➕ Nueva Factura' : '💵 Registrar Abono'} ➔ ${nombre}`;
            document.getElementById('modal-monto').value = ""; document.getElementById('modal-detalle').value = ""; document.getElementById('modal-file').value = "";
            document.getElementById('modal-transaccion').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('modal-transaccion').classList.add('hidden'); }

        async function ejecutarMovimiento() {
            const tipoEntidad = document.getElementById('modal-tipo-entidad').value; const entidadId = document.getElementById('modal-entidad-id').value;
            const tipoMovimiento = document.getElementById('modal-tipo-movimiento').value; const monto = parseFloat(document.getElementById('modal-monto').value);
            const detalle = document.getElementById('modal-detalle').value.trim() || (tipoMovimiento === 'factura' ? 'Factura' : 'Abono');
            const fileInput = document.getElementById('modal-file');

            if(isNaN(monto) || monto <= 0) return alert("Monto no válido.");
            const btn = document.getElementById('btn-guardar-mov'); btn.innerText = "⏳ Guardando..."; btn.disabled = true;

            try {
                let url_adjunto = null;
                if(fileInput.files.length > 0) {
                    const archivo = fileInput.files[0];
                    const storageRef = storage.ref(`comprobantes/${Date.now()}_${archivo.name}`);
                    const uploadSnap = await storageRef.put(archivo);
                    url_adjunto = await uploadSnap.ref.getDownloadURL();
                }

                const entidadDocRef = db.collection(tipoEntidad).doc(entidadId);
                await db.runTransaction(async (transaction) => {
                    const sfDoc = await transaction.get(entidadDocRef);
                    let nuevoSaldo = (sfDoc.data().saldo || 0) + (tipoMovimiento === 'factura' ? monto : -monto);
                    transaction.update(entidadDocRef, { saldo: nuevoSaldo });
                    
                    const nuevoMovRef = db.collection("movimientos_credito").doc();
                    transaction.set(nuevoMovRef, {
                        tipo_entidad: tipoEntidad === 'clientes' ? 'cliente' : 'proveedor',
                        entidad_id: entidadId, tipo_movimiento: tipoMovimiento, monto, detalle, url_adjunto, fecha: new Date().toISOString()
                    });
                });
                closeModal();
            } catch (e) { alert("Error: " + e); } finally { btn.innerText = "💾 Guardar Registro"; btn.disabled = false; }
        }

        async function ejecutarBaja(tipoEntidad, id, nombre) {
            const pin = prompt(`🔒 PIN de seguridad para dar de baja a:\n"${nombre}"`);
            if (pin === PIN_BAJA) { await db.collection(tipoEntidad).doc(id).update({ activo: false }); alert("Dado de baja."); } 
            else if (pin !== null) { alert("❌ PIN Incorrecto."); }
        }

        function crearTarjetaUI(tipoEntidad, id, nombre, saldo, modoCompleto) {
            const div = document.createElement('div'); div.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-200 space-y-3 relative";
            const botonBaja = modoCompleto ? `<button onclick="ejecutarBaja('${tipoEntidad}', '${id}', '${nombre}')" class="absolute top-3 right-3 text-[10px] text-gray-300 hover:text-red-500 font-bold uppercase">🚫 Baja</button>` : '';
            const botonAbono = (tipoEntidad === 'proveedores' && !modoCompleto) ? '' : `<button onclick="abrirModalTransaccion('${tipoEntidad}', '${id}', 'abono', '${nombre}')" class="flex-1 bg-emerald-50 text-emerald-700 py-2 rounded-lg text-xs font-bold border border-emerald-200 hover:bg-emerald-100">💵 Abonar</button>`;

            div.innerHTML = `
                ${botonBaja}
                <div class="flex justify-between items-start pr-12">
                    <div><h4 class="font-bold text-gray-800 text-base mb-0.5">${nombre}</h4><span class="text-[9px] bg-gray-100 text-gray-500 px-2 py-0.5 rounded font-mono">${id.substring(0,6)}...</span></div>
                    <div class="text-right"><span class="text-[10px] text-gray-400 block uppercase font-bold tracking-wider">Deuda</span><span class="text-lg font-black ${saldo > 0 ? 'text-red-600' : 'text-gray-700'}">$${saldo.toFixed(2)}</span></div>
                </div>
                <div class="flex gap-2"><button onclick="abrirModalTransaccion('${tipoEntidad}', '${id}', 'factura', '${nombre}')" class="flex-1 bg-red-50 text-red-700 py-2 rounded-lg text-xs font-bold border border-red-200 hover:bg-red-100">📄 + Factura</button>${botonAbono}</div>
                <div class="bg-gray-50 p-3 rounded-lg border border-gray-100"><p class="text-[9px] font-bold text-gray-400 uppercase tracking-wider mb-1">Historial</p><div class="historial-box max-h-24 overflow-y-auto space-y-1"><p class="text-[10px] text-gray-400 italic">Cargando...</p></div></div>
            `;
            return div;
        }
    </script>
</body>
</html>
